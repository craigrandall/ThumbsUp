name: Release

on:
  push:
    tags:
      - 'v*'   # Matches v1.0.0, v0.1.0, etc.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for git describe to work

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # === VERIFICATION (same as CI, ensures tag is good) ===
      - name: Check Rust version
        shell: pwsh
        run: rustc --version | Select-String -Pattern "1\.(7[4-9]|[8-9][0-9])" -Quiet || (Write-Error "Rust 1.74+ required"; exit 1)

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (core)
        run: cargo clippy -p thumbsup-core -- -D warnings

      - name: Lint with Clippy (shell)
        run: cargo clippy -p thumbsup-shell -- -D warnings

      - name: Lint with Clippy (config)
        run: cargo clippy -p thumbsup-config -- -D warnings

      - name: Run tests (core)
        run: cargo test -p thumbsup-core --all-features

      - name: Run tests (shell)
        run: cargo test -p thumbsup-shell -- --nocapture

      - name: Run tests (config)
        run: cargo test -p thumbsup-config -- --nocapture

      # === BUILD RELEASE ARTIFACTS ===
      - name: Build DLL
        run: cargo build --release --target x86_64-pc-windows-msvc -p thumbsup-shell

      - name: Build GUI
        run: cargo build --release --target x86_64-pc-windows-msvc -p thumbsup-config

      - name: Build MSI
        run: .\scripts\build-installer.ps1

      # === SIGN ARTIFACTS (if configured) ===
      - name: Sign binaries
        if: env.SIGNTOOL_AVAILABLE == 'true'
        shell: pwsh
        run: |
          $signCmd = 'signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /a'
          & $signCmd ThumbsUp.msi
          & $signCmd target\x86_64-pc-windows-msvc\release\thumbsup_shell.dll
          & $signCmd target\x86_64-pc-windows-msvc\release\thumbsup-config.exe
        env:
          SIGNTOOL_AVAILABLE: ${{ secrets.SIGNTOOL_AVAILABLE || 'false' }}

      # === PUBLISH TO GITHUB RELEASES ===
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          name: ThumbsUp ${{ github.ref_name }}
          body: |
            ## What's Changed
            See [CHANGELOG.md](https://github.com/craigrandall/thumbsup/blob/${{ github.ref_name }}/CHANGELOG.md)

            ## Assets
            - `ThumbsUp.msi` - Windows installer
            - `thumbsup_shell.dll` - Shell extension DLL
            - `thumbsup-config.exe` - Configuration GUI
          files: |
            ThumbsUp.msi
            target/x86_64-pc-windows-msvc/release/thumbsup_shell.dll
            target/x86_64-pc-windows-msvc/release/thumbsup-config.exe
            README.md
            CHANGELOG.md
            LICENSE-MIT
            LICENSE-APACHE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
