name: Release

on:
  push:
    tags:
      - 'v*'   # Matches v1.0.0, v0.1.0, etc.

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for git describe to work

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # === VERIFICATION (same as CI, ensures tag is good) ===
      - name: Check Rust version
        shell: pwsh
        run: |
          $versionString = (rustc --version) -split '\s+' | Select-Object -Index 1
          $minVersion = [version]"1.74.0"
          $currentVersion = [version]$versionString
          if ($currentVersion -lt $minVersion) {
              Write-Error "Rust 1.74+ required"
              exit 1
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (core)
        run: cargo clippy -p thumbsup-core -- -D warnings

      - name: Lint with Clippy (shell)
        run: cargo clippy -p thumbsup-shell -- -D warnings

      - name: Lint with Clippy (config)
        run: cargo clippy -p thumbsup-config -- -D warnings

      - name: Run tests (core)
        run: cargo test -p thumbsup-core --all-features

      - name: Run tests (shell)
        run: cargo test -p thumbsup-shell -- --nocapture

      - name: Run tests (config)
        run: cargo test -p thumbsup-config -- --nocapture

      # === BUILD RELEASE ARTIFACTS ===
      - name: Build DLL
        run: cargo build --release --target x86_64-pc-windows-msvc -p thumbsup-shell

      - name: Build GUI
        run: cargo build --release --target x86_64-pc-windows-msvc -p thumbsup-config

      - name: Build MSI
        run: .\scripts\build-installer.ps1

      # === INTEGRITY, IN LIEU OF CODE SIGNING ===
      # ThumbsUp is not code-signed -- see docs/SIGNING.md for why and
      # current status. These two steps are the real, working substitute:
      # a published checksum file, and a cryptographic build-provenance
      # attestation (Sigstore-backed, free, verifiable via
      # `gh attestation verify`). Neither of these satisfies SmartScreen
      # or Authenticode trust -- they prove integrity/provenance, not
      # publisher identity -- but both are genuine guarantees, unlike
      # the previous no-op signing step this replaced.
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(
            "ThumbsUp.msi",
            "target\x86_64-pc-windows-msvc\release\thumbsup_shell.dll",
            "target\x86_64-pc-windows-msvc\release\thumbsup-config.exe"
          )
          $lines = foreach ($f in $files) {
              $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
              "$hash  $(Split-Path -Leaf $f)"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ThumbsUp.msi
            target/x86_64-pc-windows-msvc/release/thumbsup_shell.dll
            target/x86_64-pc-windows-msvc/release/thumbsup-config.exe

      - name: Delete existing release (if any)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: (await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: context.ref.replace('refs/tags/', '')
                })).data.id
              });
            } catch (e) {
              // Ignore if release doesn't exist
            }

      # === PUBLISH TO GITHUB RELEASES ===
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThumbsUp ${{ github.ref_name }}
          body: |
            ## What's Changed
            See [CHANGELOG.md](https://github.com/craigrandall/thumbsup/blob/${{ github.ref_name }}/CHANGELOG.md)

            ## Assets
            - `ThumbsUp.msi` - Windows installer
            - `thumbsup_shell.dll` - Shell extension DLL
            - `thumbsup-config.exe` - Configuration GUI
            - `SHA256SUMS.txt` - Checksums for the three files above

            **Not code-signed** -- see [docs/SIGNING.md](https://github.com/craigrandall/thumbsup/blob/${{ github.ref_name }}/docs/SIGNING.md)
            for why, current status, and how to verify integrity via the
            checksums above or this release's build-provenance attestation.
          files: |
            ThumbsUp.msi
            target/x86_64-pc-windows-msvc/release/thumbsup_shell.dll
            target/x86_64-pc-windows-msvc/release/thumbsup-config.exe
            SHA256SUMS.txt
            README.md
            CHANGELOG.md
            LICENSE-MIT
            LICENSE-APACHE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
