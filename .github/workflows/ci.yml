name: CI
# This workflow runs on every push to `main` and every pull request targeting `main`.
# It automates the complete verification gate: fmt, clippy, test, build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Cross-platform core verification (Linux)
  verify-core:
    name: Verify Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.74.0"
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (core)
        run: cargo clippy -p thumbsup-core -- -D warnings

      - name: Check compilation (core)
        run: cargo check -p thumbsup-core

      - name: Run tests (core)
        run: cargo test -p thumbsup-core --all-features

  # Windows-specific verification
  verify-windows:
    name: Verify Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.74.0"
          target: x86_64-pc-windows-msvc  # Only for Windows job
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (shell)
        run: cargo clippy -p thumbsup-shell -- -D warnings

      - name: Lint with Clippy (config)
        run: cargo clippy -p thumbsup-config -- -D warnings

      - name: Check compilation (shell)
        run: cargo check -p thumbsup-shell --target x86_64-pc-windows-msvc

      - name: Check compilation (config)
        run: cargo check -p thumbsup-config --target x86_64-pc-windows-msvc

      - name: Run tests (shell)
        run: cargo test -p thumbsup-shell -- --nocapture

      - name: Run tests (config)
        run: cargo test -p thumbsup-config -- --nocapture

      - name: Build release (shell)
        run: cargo build --release --target x86_64-pc-windows-msvc -p thumbsup-shell

      - name: Build release (config)
        run: cargo build --release --target x86_64-pc-windows-msvc -p thumbsup-config