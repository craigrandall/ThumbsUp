[workspace]
resolver = "2"
members = [
    "crates/thumbsup-core",
    "crates/thumbsup-shell",
    "crates/thumbsup-config",
]
# Only the cross-platform core is built by default. The Windows-specific crates
# build cleanly on a Windows host with `cargo build --workspace`; on other
# platforms they are gated behind `#[cfg(windows)]` and produce empty libraries.
default-members = ["crates/thumbsup-core"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.74"
license      = "MIT OR Apache-2.0"
authors      = ["Craig Randall"]
repository   = "https://github.com/example/thumbsup"
description  = "ThumbsUp — Windows 11 File Explorer thumbnail handler for EPUB files"

[workspace.dependencies]
# Core EPUB parsing
zip        = { version = "0.6.6", default-features = false, features = ["deflate"] }
quick-xml  = "0.31"
image      = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif"] }
thiserror  = "1.0"
log        = "0.4"

# Windows shell extension
windows = { version = "=0.58.0", features = [
    # `implement` unlocks the IFoo_Impl traits the COM provider uses,
    # plus the #[implement] proc-macro itself. Without this feature the
    # macro expands to traits that don't exist in the crate.
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # `Win32_Security` is required transitively by the registry APIs
    # (LPSECURITY_ATTRIBUTES is part of RegCreateKeyExW's signature);
    # without it the function appears unresolved at compile time.
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    # Required for DLL_PROCESS_ATTACH / DLL_PROCESS_DETACH constants in DllMain.
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
# Pinned exactly so a fresh clone resolves to the same version against
# which the #[implement] call sites in com.rs were authored. The
# windows-implement proc-macro changes shape between minor versions.
windows-core = "=0.58.0"

# GUI configuration tool
eframe   = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui     = "0.27"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
chrono   = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rfd      = { version = "0.14", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.release-dll]
inherits = "release"
# Shell extensions live inside Explorer; minimize size, never panic-abort the host.
panic    = "abort"
